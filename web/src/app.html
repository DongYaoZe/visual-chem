<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light" />
		<style>
			.noscript-notice {
				padding: 0.8rem 1rem;
				border-bottom: 1px solid #bf3d30;
				background: #fff4df;
				color: #1f2826;
				font: 600 0.9rem/1.55 sans-serif;
				text-align: center;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<div class="noscript-notice">
				正文与公式仍可阅读；滚动同步、实验控件和答案验证需要 JavaScript。<br />The prose and
				formulas remain readable; interactive figures and checks require JavaScript.
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
