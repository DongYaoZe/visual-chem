<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">翻山的分子 — VisualChem</title>
  <desc id="desc">冷热麦克斯韦-玻尔兹曼分布、活化能门槛与被温度放大的分布尾巴。</desc>
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c1714"/><stop offset="1" stop-color="#663024"/></linearGradient>
    <pattern id="dust" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#f4efe4" fill-opacity=".07"/></pattern>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d66b32" stop-opacity=".48"/><stop offset="1" stop-color="#d66b32" stop-opacity=".08"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#1b0c09" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#ember)"/><rect width="1200" height="630" fill="url(#dust)"/>
  <g transform="translate(78 52)"><rect width="42" height="42" rx="11" fill="#f4efe4"/><path d="M8 33C12 17 22 10 32 15C35 17 36 20 36 23" fill="none" stroke="#173f43" stroke-width="3.5" stroke-linecap="round"/><path d="M8 33C14 26 23 21 30 21C33 21 35 22 36 23" fill="none" stroke="#d66b32" stroke-width="3.5" stroke-linecap="round"/><circle cx="35" cy="23" r="2.7" fill="#173f43"/><text x="56" y="29" fill="#f4efe4" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">VisualChem</text></g>
  <text x="78" y="186" fill="#f2a17d" font-family="SF Mono, Consolas, monospace" font-size="24" font-weight="700" letter-spacing="6">KINETICS · STORY 09</text>
  <text x="74" y="278" fill="#f4efe4" font-family="Georgia, Songti SC, serif" font-size="82" font-weight="600" letter-spacing="-2">翻山的</text>
  <text x="74" y="372" fill="#f2a17d" font-family="Georgia, Songti SC, serif" font-size="82" font-weight="600" letter-spacing="-2">分子</text>
  <text x="78" y="432" fill="#ead9d2" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="29">升温不是把整座人群推快 —</text>
  <text x="78" y="474" fill="#ead9d2" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="29">而是放大能越过山口的稀薄尾巴</text>
  <g transform="translate(690 120)" filter="url(#shadow)">
    <rect width="440" height="420" rx="28" fill="#f7f2e6"/>
    <g transform="translate(46 46)">
      <path d="M0 310H350M0 26V310" fill="none" stroke="#342b28" stroke-width="3"/>
      <path d="M250 310L250 245C279 268 313 288 350 299V310Z" fill="url(#tail)"/>
      <path d="M0 307C28 299 45 250 67 166S116 47 155 84S205 225 350 300" fill="none" stroke="#527b86" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 308C42 299 72 266 101 195S161 91 210 143S265 250 350 291" fill="none" stroke="#c44b32" stroke-width="7" stroke-linecap="round"/>
      <path d="M250 25V310" stroke="#8b3527" stroke-width="3" stroke-dasharray="8 7"/>
      <path d="M242 42L250 26L258 42" fill="#8b3527"/>
      <text x="250" y="18" fill="#8b3527" font-family="SF Mono, Consolas, monospace" font-size="17" font-weight="800" text-anchor="middle">Eₐ</text>
      <text x="116" y="62" fill="#416671" font-family="SF Mono, Consolas, monospace" font-size="15" font-weight="800">cold</text>
      <text x="208" y="126" fill="#a33e2b" font-family="SF Mono, Consolas, monospace" font-size="15" font-weight="800">hot</text>
      <text x="340" y="275" fill="#a33e2b" font-family="SF Mono, Consolas, monospace" font-size="14" font-weight="800" text-anchor="end">reactive tail</text>
      <text x="350" y="338" fill="#342b28" font-family="SF Mono, Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">energy</text>
    </g>
  </g>
  <g transform="translate(78 520)"><rect width="390" height="58" rx="29" fill="#f4efe4" fill-opacity=".1" stroke="#f4efe4" stroke-opacity=".35"/><text x="195" y="37" fill="#f4efe4" font-family="SF Mono, Consolas, monospace" font-size="21" font-weight="700" text-anchor="middle">the tail is computed</text></g>
</svg>
