<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">熵不是混乱 — VisualChem</title>
  <desc id="desc">双球泡气体与微观状态尖峰组成的分享图:S = k ln W。</desc>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12282c"/>
      <stop offset="1" stop-color="#1e454c"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#f4efe4" fill-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0a1a1d" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#dusk)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <g transform="translate(78 52)">
    <rect width="42" height="42" rx="11" fill="#f4efe4"/>
    <path d="M8 33C12 17 22 10 32 15C35 17 36 20 36 23" fill="none" stroke="#173f43" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M8 33C14 26 23 21 30 21C33 21 35 22 36 23" fill="none" stroke="#d66b32" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="35" cy="23" r="2.7" fill="#173f43"/>
    <text x="56" y="29" fill="#f4efe4" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" letter-spacing="-.5">VisualChem</text>
  </g>

  <text x="78" y="186" fill="#8fc7cf" font-family="SF Mono, Consolas, monospace" font-size="24" font-weight="700" letter-spacing="6">THERMODYNAMICS · STORY 05</text>
  <text x="74" y="278" fill="#f4efe4" font-family="Georgia, Songti SC, serif" font-size="82" font-weight="600" letter-spacing="-2">熵不是</text>
  <text x="74" y="372" fill="#8fc7cf" font-family="Georgia, Songti SC, serif" font-size="82" font-weight="600" letter-spacing="-2">混乱</text>
  <text x="78" y="434" fill="#cfdde0" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="30">它是一次诚实的计数 —</text>
  <text x="78" y="478" fill="#cfdde0" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="30">逐个数微观状态,赔率宣判不可逆</text>

  <!-- histogram spike card -->
  <g transform="translate(700 118)" filter="url(#shadow)">
    <rect width="430" height="430" rx="26" fill="#f7f2e6"/>
    <g transform="translate(40 46)">
      <!-- binomial spike: bars -->
      <g fill="#207f8c">
        <rect x="0"   y="316" width="10" height="4"/>
        <rect x="25"  y="308" width="10" height="12"/>
        <rect x="50"  y="290" width="10" height="30"/>
        <rect x="75"  y="252" width="10" height="68"/>
        <rect x="100" y="180" width="10" height="140"/>
        <rect x="125" y="80"  width="10" height="240"/>
        <rect x="150" y="20"  width="10" height="300"/>
        <rect x="175" y="80"  width="10" height="240"/>
        <rect x="200" y="180" width="10" height="140"/>
        <rect x="225" y="252" width="10" height="68"/>
        <rect x="250" y="290" width="10" height="30"/>
        <rect x="275" y="308" width="10" height="12"/>
        <rect x="300" y="316" width="10" height="4"/>
      </g>
      <!-- lonely all-left bar -->
      <rect x="340" y="314" width="10" height="6" fill="#bf3d30"/>
      <text x="345" y="304" fill="#bf3d30" font-family="SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">1</text>
      <line x1="-6" y1="320" x2="356" y2="320" stroke="#233532" stroke-width="3"/>
      <text x="155" y="352" fill="#233532" font-family="SF Mono, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">S = k ln W</text>
    </g>
  </g>

  <g transform="translate(78 520)">
    <rect width="330" height="58" rx="29" fill="#f4efe4" fill-opacity=".1" stroke="#f4efe4" stroke-opacity=".35"/>
    <text x="165" y="37" fill="#f4efe4" font-family="SF Mono, Consolas, monospace" font-size="21" font-weight="700" text-anchor="middle">the map is computed</text>
  </g>
</svg>
