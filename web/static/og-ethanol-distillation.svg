<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">永远到不了的 100% — VisualChem</title>
  <desc id="desc">乙醇与水的常压共沸故事分享图，展示相平衡曲线在约 95.5% 乙醇质量分数处会合。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102f32"/>
      <stop offset="1" stop-color="#1f4d4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 116) rotate(126) scale(460 420)">
      <stop stop-color="#f5a55a" stop-opacity=".24"/>
      <stop offset="1" stop-color="#f5a55a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#f4efe4" fill-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#071c1e" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#night)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <g transform="translate(78 52)">
    <rect width="42" height="42" rx="11" fill="#f4efe4"/>
    <path d="M8 33C12 17 22 10 32 15C35 17 36 20 36 23" fill="none" stroke="#173f43" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M8 33C14 26 23 21 30 21C33 21 35 22 36 23" fill="none" stroke="#d66b32" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="35" cy="23" r="2.7" fill="#173f43"/>
    <text x="56" y="29" fill="#f4efe4" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" letter-spacing="-.5">VisualChem</text>
  </g>

  <text x="80" y="158" fill="#72c6cb" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="3">STORY 01 · PHASE EQUILIBRIUM</text>
  <text x="76" y="247" fill="#f4efe4" font-family="Iowan Old Style, Songti SC, Microsoft YaHei, serif" font-size="69" font-weight="600" letter-spacing="-3">永远到不了的</text>
  <text x="76" y="358" fill="#f5a55a" font-family="Iowan Old Style, Songti SC, Microsoft YaHei, serif" font-size="124" font-style="italic" font-weight="600" letter-spacing="-5">100%</text>
  <text x="80" y="419" fill="#d9e2dc" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="23">
    <tspan x="80" dy="0">一滴酒与一张图，如何揭开</tspan>
    <tspan x="80" dy="36">乙醇—水常压共沸的边界？</tspan>
  </text>
  <g transform="translate(80 507)">
    <rect width="280" height="45" rx="22.5" fill="#f4efe4" fill-opacity=".1" stroke="#f4efe4" stroke-opacity=".22"/>
    <circle cx="23" cy="22.5" r="6" fill="#f5a55a"/>
    <text x="42" y="29" fill="#f4efe4" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="17">约 12 分钟 · 可操纵故事</text>
  </g>

  <g transform="translate(717 74)" filter="url(#shadow)">
    <rect width="412" height="482" rx="32" fill="#f4efe4"/>
    <text x="34" y="48" fill="#496552" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">THE LIMIT OF DISTILLATION</text>
    <text x="34" y="125" fill="#173f43" font-family="Iowan Old Style, Georgia, serif" font-size="67" font-weight="600" letter-spacing="-2">≈95.5%</text>
    <text x="36" y="153" fill="#4e5955" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="15">乙醇质量分数 · 101.3 kPa 实验约值</text>
    <path d="M42 201H370M42 271H370M42 341H370M112 183V409M192 183V409M272 183V409" stroke="#1f2826" stroke-opacity=".09"/>
    <path d="M48 384C89 250 176 193 274 227C310 240 338 267 359 302" fill="none" stroke="#207f8c" stroke-width="6" stroke-linecap="round"/>
    <path d="M48 384C107 316 179 281 250 273C298 268 337 283 359 302" fill="none" stroke="#d66b32" stroke-width="6" stroke-linecap="round" stroke-dasharray="17 11"/>
    <path d="M329 206V402" stroke="#496552" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="351" cy="295" r="9" fill="#fffaf0" stroke="#173f43" stroke-width="4"/>
    <text x="44" y="444" fill="#207f8c" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="700">LIQUID x</text>
    <text x="146" y="444" fill="#d66b32" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="700">VAPOR y</text>
    <text x="370" y="444" fill="#496552" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="15" text-anchor="end">y = x</text>
  </g>

  <text x="1120" y="597" fill="#b9d9d6" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" text-anchor="end">DONGYAOZE.GITHUB.IO/VISUAL-CHEM</text>
</svg>
