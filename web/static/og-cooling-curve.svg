<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">冷却曲线侦探 — VisualChem</title>
  <desc id="desc">铋镉共晶相图与冷却曲线分享图：液相线、共晶点与降温曲线的转折台阶。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#2d3548"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(950 140) rotate(118) scale(520 480)">
      <stop stop-color="#e8927c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e8927c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#f4efe4" fill-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0a0d14" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#night)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <g transform="translate(78 52)">
    <rect width="42" height="42" rx="11" fill="#f4efe4"/>
    <path d="M8 33C12 17 22 10 32 15C35 17 36 20 36 23" fill="none" stroke="#173f43" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M8 33C14 26 23 21 30 21C33 21 35 22 36 23" fill="none" stroke="#d66b32" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="35" cy="23" r="2.7" fill="#173f43"/>
    <text x="56" y="29" fill="#f4efe4" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" letter-spacing="-.5">VisualChem</text>
  </g>

  <text x="78" y="196" fill="#e8a894" font-family="SF Mono, Consolas, monospace" font-size="24" font-weight="700" letter-spacing="6">PHASE EQUILIBRIUM · STORY 04</text>
  <text x="74" y="300" fill="#f4efe4" font-family="Georgia, Songti SC, serif" font-size="92" font-weight="600" letter-spacing="-2">冷却曲线侦探</text>
  <text x="78" y="360" fill="#c8d6d2" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="30">从熔体的一条降温记录</text>
  <text x="78" y="404" fill="#c8d6d2" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="30">倒推出完整的二元相图</text>

  <!-- T-x diagram + cooling curve card -->
  <g transform="translate(680 108)" filter="url(#shadow)">
    <rect width="450" height="450" rx="26" fill="#f7f2e6"/>
    <g transform="translate(42 36)">
      <!-- axes -->
      <path d="M8 350H370M8 350V20" fill="none" stroke="#233532" stroke-width="3" stroke-linecap="round"/>
      <!-- liquidus curve (two branches meeting at eutectic) -->
      <path d="M20 30C38 68 56 112 74 156C84 182 94 208 104 234L112 258" fill="none" stroke="#d66b32" stroke-width="5" stroke-linecap="round"/>
      <path d="M360 80C330 120 300 160 270 200C240 238 210 248 180 258L112 258" fill="none" stroke="#d66b32" stroke-width="5" stroke-linecap="round"/>
      <!-- eutectic horizontal line -->
      <path d="M20 258H360" fill="none" stroke="#bf3d30" stroke-width="3" stroke-dasharray="6 9"/>
      <!-- eutectic point -->
      <circle cx="112" cy="258" r="9" fill="#f7f2e6" stroke="#bf3d30" stroke-width="4"/>
      <text x="128" y="274" fill="#bf3d30" font-family="SF Mono, Consolas, monospace" font-size="17" font-weight="700">共晶点</text>
      <!-- cooling curve (time axis on right, overlaid) -->
      <g transform="translate(280 0)" opacity="0.72">
        <!-- smooth descent -->
        <path d="M0 30L0 140" fill="none" stroke="#5a8a92" stroke-width="4" stroke-linecap="round"/>
        <!-- break (first crystal) -->
        <circle cx="0" cy="140" r="4.5" fill="#5a8a92"/>
        <!-- sloped segment -->
        <path d="M0 140L0 200" fill="none" stroke="#5a8a92" stroke-width="4" stroke-linecap="round"/>
        <!-- eutectic arrest (horizontal plateau) -->
        <circle cx="0" cy="200" r="4.5" fill="#5a8a92"/>
        <path d="M0 200L28 200" fill="none" stroke="#5a8a92" stroke-width="4" stroke-linecap="round"/>
        <circle cx="28" cy="200" r="4.5" fill="#5a8a92"/>
        <!-- final descent -->
        <path d="M28 200L28 270" fill="none" stroke="#5a8a92" stroke-width="4" stroke-linecap="round"/>
        <text x="38" y="205" fill="#5a8a92" font-family="SF Mono, Consolas, monospace" font-size="15" font-weight="700">台阶</text>
      </g>
      <!-- axis labels -->
      <text x="190" y="372" fill="#5c6b66" font-family="SF Mono, Consolas, monospace" font-size="16" text-anchor="middle">x(Cd)</text>
      <text x="-6" y="190" fill="#5c6b66" font-family="SF Mono, Consolas, monospace" font-size="16">T</text>
    </g>
  </g>

  <g transform="translate(78 520)">
    <rect width="360" height="58" rx="29" fill="#f4efe4" fill-opacity=".1" stroke="#f4efe4" stroke-opacity=".35"/>
    <text x="180" y="37" fill="#f4efe4" font-family="SF Mono, Consolas, monospace" font-size="21" font-weight="700" text-anchor="middle">the curve computes the map</text>
  </g>
</svg>
