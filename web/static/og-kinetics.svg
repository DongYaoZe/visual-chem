<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">浓度的倒计时 — VisualChem</title>
  <desc id="desc">由指数衰减曲线、等距半衰期鼓点与双氧水气泡组成的分享图。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10282b"/><stop offset="1" stop-color="#174951"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#f4efe4" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#08191b" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#night)"/><rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(78 52)">
    <rect width="42" height="42" rx="11" fill="#f4efe4"/>
    <path d="M8 33C12 17 22 10 32 15C35 17 36 20 36 23" fill="none" stroke="#173f43" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M8 33C14 26 23 21 30 21C33 21 35 22 36 23" fill="none" stroke="#d66b32" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="35" cy="23" r="2.7" fill="#173f43"/>
    <text x="56" y="29" fill="#f4efe4" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">VisualChem</text>
  </g>
  <text x="78" y="186" fill="#86d1da" font-family="SF Mono, Consolas, monospace" font-size="24" font-weight="700" letter-spacing="6">KINETICS · STORY 08</text>
  <text x="74" y="278" fill="#f4efe4" font-family="Georgia, Songti SC, serif" font-size="82" font-weight="600" letter-spacing="-2">浓度的</text>
  <text x="74" y="372" fill="#86d1da" font-family="Georgia, Songti SC, serif" font-size="82" font-weight="600" letter-spacing="-2">倒计时</text>
  <text x="78" y="432" fill="#cfdee0" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="29">速率是坡度，半衰期是指纹 —</text>
  <text x="78" y="474" fill="#cfdee0" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="29">同一只秒表，从药箱走到碳-14</text>
  <g transform="translate(690 120)" filter="url(#shadow)">
    <rect width="440" height="420" rx="28" fill="#f7f2e6"/>
    <g transform="translate(50 42)">
      <path d="M0 312H340M0 20V312" fill="none" stroke="#263b39" stroke-width="3"/>
      <g stroke="#207f8c" stroke-opacity=".28" stroke-dasharray="5 7">
        <path d="M78 20V312"/><path d="M156 20V312"/><path d="M234 20V312"/>
      </g>
      <path d="M0 30C34 38 59 59 78 92S127 153 156 177S205 221 234 243S292 278 340 292" fill="none" stroke="#207f8c" stroke-width="7" stroke-linecap="round"/>
      <path d="M78 92H0M156 177H0M234 243H0" stroke="#d66b32" stroke-width="2" stroke-dasharray="7 7"/>
      <circle cx="156" cy="177" r="9" fill="#d66b32" stroke="#f7f2e6" stroke-width="4"/>
      <text x="78" y="336" fill="#175059" font-family="SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">t½</text>
      <text x="156" y="336" fill="#175059" font-family="SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">2t½</text>
      <text x="234" y="336" fill="#175059" font-family="SF Mono, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">3t½</text>
      <text x="12" y="15" fill="#263b39" font-family="SF Mono, Consolas, monospace" font-size="18" font-weight="700">c / c₀</text>
      <text x="340" y="336" fill="#263b39" font-family="SF Mono, Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">t</text>
    </g>
  </g>
  <g transform="translate(78 520)"><rect width="360" height="58" rx="29" fill="#f4efe4" fill-opacity=".1" stroke="#f4efe4" stroke-opacity=".35"/><text x="180" y="37" fill="#f4efe4" font-family="SF Mono, Consolas, monospace" font-size="21" font-weight="700" text-anchor="middle">the clock is computed</text></g>
</svg>
