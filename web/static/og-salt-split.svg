<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">一锅盐水的分身术 — VisualChem</title>
  <desc id="desc">水—硝酸钾—硝酸钠三元相图分享图:两支饱和边界在共饱和点相遇,操作轨迹绕开双盐之谷。</desc>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#232238"/>
      <stop offset="1" stop-color="#3c3a5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 120) rotate(126) scale(460 420)">
      <stop stop-color="#b0b3d8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#b0b3d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#f4efe4" fill-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#12111f" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#dusk)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <g transform="translate(78 52)">
    <rect width="42" height="42" rx="11" fill="#f4efe4"/>
    <path d="M8 33C12 17 22 10 32 15C35 17 36 20 36 23" fill="none" stroke="#173f43" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M8 33C14 26 23 21 30 21C33 21 35 22 36 23" fill="none" stroke="#d66b32" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="35" cy="23" r="2.7" fill="#173f43"/>
    <text x="56" y="29" fill="#f4efe4" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" letter-spacing="-.5">VisualChem</text>
  </g>

  <text x="78" y="186" fill="#b0b3d8" font-family="SF Mono, Consolas, monospace" font-size="24" font-weight="700" letter-spacing="6">PHASE EQUILIBRIUM · STORY 03</text>
  <text x="74" y="272" fill="#f4efe4" font-family="Georgia, Songti SC, serif" font-size="76" font-weight="600" letter-spacing="-2">一锅盐水的</text>
  <text x="74" y="362" fill="#b0b3d8" font-family="Georgia, Songti SC, serif" font-size="76" font-weight="600" letter-spacing="-2">分身术</text>
  <text x="78" y="424" fill="#cdd0e2" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="30">两种盐溶进同一锅水 —</text>
  <text x="78" y="468" fill="#cdd0e2" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="30">三角地图教你一种一种请出来</text>

  <!-- ternary map card -->
  <g transform="translate(700 118)" filter="url(#shadow)">
    <rect width="430" height="430" rx="26" fill="#f7f2e6"/>
    <g transform="translate(37 30)">
      <!-- triangle: KNO3 bottom-left, NaNO3 bottom-right, H2O apex -->
      <path d="M14 350 L356 350 L185 32 Z" fill="none" stroke="#233532" stroke-width="3" stroke-linejoin="round"/>
      <!-- KNO3 saturation branch (violet) -->
      <path d="M96 197 C118 208 140 226 152 262" fill="none" stroke="#5f6398" stroke-width="6" stroke-linecap="round"/>
      <!-- NaNO3 saturation branch (amber) -->
      <path d="M258 210 C222 224 176 240 152 262" fill="none" stroke="#c08a2e" stroke-width="6" stroke-linecap="round"/>
      <!-- operation track: cool, filter jump, evaporate away from apex -->
      <path d="M185 170 L152 262 L214 330" fill="none" stroke="#bf3d30" stroke-width="3" stroke-dasharray="5 8"/>
      <!-- the pot -->
      <circle cx="185" cy="170" r="11" fill="#bf3d30"/>
      <circle cx="185" cy="170" r="4.5" fill="#f7f2e6"/>
      <!-- eutonic -->
      <circle cx="152" cy="262" r="8" fill="#f7f2e6" stroke="#bf3d30" stroke-width="4"/>
      <text x="128" y="280" fill="#bf3d30" font-family="SF Mono, Consolas, monospace" font-size="17" font-weight="700">E</text>
      <!-- vertex labels -->
      <text x="185" y="20" fill="#233532" font-family="SF Mono, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">H₂O</text>
      <text x="10" y="376" fill="#4c4f7c" font-family="SF Mono, Consolas, monospace" font-size="16" font-weight="800">KNO₃</text>
      <text x="356" y="376" fill="#a3702a" font-family="SF Mono, Consolas, monospace" font-size="16" font-weight="800" text-anchor="end">NaNO₃</text>
    </g>
  </g>

  <g transform="translate(78 520)">
    <rect width="330" height="58" rx="29" fill="#f4efe4" fill-opacity=".1" stroke="#f4efe4" stroke-opacity=".35"/>
    <text x="165" y="37" fill="#f4efe4" font-family="SF Mono, Consolas, monospace" font-size="21" font-weight="700" text-anchor="middle">the map is computed</text>
  </g>
</svg>
