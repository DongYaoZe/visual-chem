<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">VisualChem — 用故事看懂化学</title>
  <desc id="desc">VisualChem 首页分享图：宏观现象、微观粒子与化学符号在同一个故事中联动。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e7decc"/>
    </linearGradient>
    <radialGradient id="warm" cx="0" cy="0" r="1" gradientTransform="translate(171 56) rotate(42) scale(420 310)">
      <stop stop-color="#f5a55a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f5a55a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0" cy="0" r="1" gradientTransform="translate(1042 105) rotate(132) scale(430 330)">
      <stop stop-color="#72c6cb" stop-opacity=".3"/>
      <stop offset="1" stop-color="#72c6cb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2826" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1f2826" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#cool)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(78 54)">
    <rect width="42" height="42" rx="11" fill="#173f43"/>
    <path d="M8 33C12 17 22 10 32 15C35 17 36 20 36 23" fill="none" stroke="#f4efe4" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M8 33C14 26 23 21 30 21C33 21 35 22 36 23" fill="none" stroke="#f5a55a" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="35" cy="23" r="2.7" fill="#fff8e9"/>
    <text x="56" y="29" fill="#1f2826" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" letter-spacing="-.5">VisualChem</text>
  </g>

  <text x="80" y="160" fill="#496552" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="3">OPEN CHEMISTRY · EXPLORABLE STORIES</text>
  <text x="76" y="245" fill="#1f2826" font-family="Iowan Old Style, Songti SC, Microsoft YaHei, serif" font-size="61" font-weight="600" letter-spacing="-3">不是把相图画出来。</text>
  <text x="76" y="322" fill="#d66b32" font-family="Iowan Old Style, Songti SC, Microsoft YaHei, serif" font-size="67" font-style="italic" font-weight="600" letter-spacing="-3">是让它开口。</text>
  <text x="80" y="386" fill="#3f4d49" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="23">
    <tspan x="80" dy="0">把宏观现象、微观粒子与化学符号，</tspan>
    <tspan x="80" dy="36">锁进同一个可操纵的故事。</tspan>
  </text>

  <g transform="translate(746 74)" filter="url(#shadow)">
    <rect width="382" height="470" rx="30" fill="#173f43"/>
    <path d="M28 95H354M28 173H354M28 251H354M28 329H354M106 68V398M184 68V398M262 68V398" stroke="#f4efe4" stroke-opacity=".085"/>
    <text x="30" y="45" fill="#72c6cb" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.2">ONE STATE · THREE VIEWS</text>
    <path d="M44 368C88 167 197 86 313 176C329 189 340 212 346 239" fill="none" stroke="#72c6cb" stroke-width="7" stroke-linecap="round"/>
    <path d="M44 368C109 288 182 239 255 225C294 218 329 226 346 239" fill="none" stroke="#f5a55a" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 12"/>
    <path d="M313 149V360" stroke="#fff8e9" stroke-width="2" stroke-dasharray="6 8" opacity=".7"/>
    <circle cx="340" cy="233" r="9" fill="#fff8e9" stroke="#173f43" stroke-width="4"/>
    <circle cx="102" cy="311" r="5" fill="#f5a55a"/>
    <circle cx="153" cy="217" r="5" fill="#72c6cb"/>
    <circle cx="219" cy="238" r="5" fill="#f5a55a"/>
    <text x="30" y="424" fill="#f4efe4" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="18" font-weight="600">宏观 ↔ 微观 ↔ 符号</text>
    <text x="352" y="424" fill="#b9d9d6" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" text-anchor="end">SYNCED</text>
  </g>

  <path d="M80 556H1120" stroke="#1f2826" stroke-opacity=".18"/>
  <text x="80" y="594" fill="#1f2826" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700">DONGYAOZE.GITHUB.IO/VISUAL-CHEM</text>
  <text x="1120" y="594" fill="#496552" font-family="Avenir Next, Microsoft YaHei, sans-serif" font-size="17" text-anchor="end">开源 · 可核验 · 可探索</text>
</svg>
