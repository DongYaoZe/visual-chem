name: VisualChem CI

on:
  pull_request:
    paths:
      - 'web/**'
      - 'validation/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'LICENSE-CONTENT.md'
      - 'CITATION.cff'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'validation/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'LICENSE-CONTENT.md'
      - 'CITATION.cff'

permissions:
  contents: read

concurrency:
  group: visualchem-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      BASE_PATH: /visual-chem
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Static, numerical, and production build checks
        run: npm run validate
      - name: Pages-base browser, accessibility, no-JS, and offline checks
        run: npm run test:e2e
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore
